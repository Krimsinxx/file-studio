name: Build Windows Pre-release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Select release type'
        required: true
        type: choice
        default: 'Bump Build'
        options:
          - 'Bump Build'
          - 'Release'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Bump version in Cargo.toml
        id: bump
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          if ($content -match '(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"') {
            $firstMajor = [int]$matches[1]
            $secondMajor = [int]$matches[2]
            $minor = [int]$matches[3]

            if ("${{ inputs.release_type }}" -eq "Release") {
              $secondMajor += 1
              if ($secondMajor -gt 9) {
                $firstMajor += 1
                $secondMajor = 0
              }
              $minor = 0
            } else {
              $minor += 1
            }

            $newVersion = "$firstMajor.$secondMajor.$minor"
            
            # Update Cargo.toml with the new version
            $updated = $content -replace '(?m)^version\s*=\s*"\d+\.\d+\.\d+"', "version = `"$newVersion`""
            Set-Content Cargo.toml $updated -NoNewline
            
            # Update Cargo.lock to match the new workspace version
            cargo update -w
            
            # Output the new version for later steps
            echo "version=$newVersion" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not find package version in Cargo.toml"
            exit 1
          }

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Publish to GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}-preview
          name: v${{ steps.bump.outputs.version }} - Preview
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: target/release/FileStudio.exe
