name: Build Windows Minor Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Bump patch version in Cargo.toml
        id: bump
        shell: pwsh
        run: |
          $content = Get-Content Cargo.toml -Raw
          if ($content -match '(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"') {
            $major = $matches[1]
            $minor = $matches[2]
            $patch = [int]$matches[3] + 1
            $newVersion = "$major.$minor.$patch"
            
            # Update Cargo.toml with the new version
            $updated = $content -replace '(?m)^version\s*=\s*"\d+\.\d+\.\d+"', "version = `"$newVersion`""
            Set-Content Cargo.toml $updated -NoNewline
            
            # Update Cargo.lock to match the new workspace version
            cargo update -w
            
            # Output the new version for later steps
            echo "version=$newVersion" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Could not find package version in Cargo.toml"
            exit 1
          }

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to v${{ steps.bump.outputs.version }}"
          git push

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }} - Bump Build
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: target/release/FileStudio.exe
