[package]
name = "file_studio"
version = "0.2.18"
edition = "2024"

[[bin]]
name = "FileStudio"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", features = ["image"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winres = "0.1"
